name: Install smoke (reusable)

# Shared CI job: build this repo's own xar, then install it (and anything
# it declares as a dependency) into a bare eXist via xst - not a volume
# mount into /exist/autodeploy, which only works for self-contained xars
# with no declared dependencies (AutoDeploymentTrigger just installs
# whatever's sitting in that directory, with no registry resolution).
# Pairs with test/install-smoke.bats in this repo. See
# BetaMasaheft/BetMasApi#29 for where this pattern (and its bug fixes)
# came from.

on:
  workflow_call:
    inputs:
      package-uri:
        description: "Override the package URI to check for in deploy logs. Defaults to this repo's expath-pkg.xml <package name=...> attribute."
        required: false
        type: string
        default: ""
      existdb-image:
        required: false
        type: string
        default: duncdrum/existdb:release-slim
      java-version:
        required: false
        type: string
        default: "8"
      registry-url:
        description: >
          Base registry URL, short form (no trailing /public). `from-registry`
          calls use this as-is; `local-files` calls append /public - the two
          xst subcommands expect different URL shapes against the same
          registry (confirmed empirically, see BetaMasaheft/.github's PR
          history for this workflow).
        required: false
        type: string
        default: https://exist-db.org/exist/apps/public-repo
      extra-packages:
        description: >
          Newline-separated, ordered list of package QNames or abbrevs (e.g.
          monex, functx) to install via `xst package install from-registry`
          before this repo's own package. Leave empty if there are none.
        required: false
        type: string
        default: ""
      extra-xars-artifact:
        description: >
          Name of a GitHub Actions artifact - built and uploaded by a job in
          the *calling* workflow, not this one - containing one or more
          pre-built .xar files to install via `local-files` before this
          repo's own package. Install order follows filename sort order, so
          name files accordingly (e.g. 01-Foo.xar, 02-Bar.xar) if it matters.
          Leave empty if there's nothing to install this way.
        required: false
        type: string
        default: ""
      shared-ref:
        description: "Ref of BetaMasaheft/.github to pull the shared bats file from."
        required: false
        type: string
        default: main

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install bats and xmllint
        run: |
          sudo apt-get update
          sudo apt-get install -y bats libxml2-utils

      - name: Resolve package URI
        id: pkg
        run: |
          uri="${{ inputs.package-uri }}"
          if [ -z "$uri" ]; then
            uri=$(xmllint --xpath 'string(/*[local-name()="package"]/@name)' expath-pkg.xml)
          fi
          if [ -z "$uri" ]; then
            echo "::error::could not resolve a package URI from expath-pkg.xml and none was passed in"
            exit 1
          fi
          echo "Resolved package URI: $uri"
          echo "uri=$uri" >> "$GITHUB_OUTPUT"

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: ${{ inputs.java-version }}

      - run: ant

      - name: Start a bare eXist instance
        run: |
          docker run -dit -p 8080:8080 --name exist --rm \
            --health-interval=2s --health-timeout=5s --health-start-period=8s --health-retries=3 \
            ${{ inputs.existdb-image }}

      - name: Wait for server to start
        timeout-minutes: 2
        run: |
          until docker logs exist 2>&1 | grep -q "Server has started"; do
            echo "Still waiting..."
            sleep 2
          done
          # Fixed sleep, not a wait-for-healthy loop: settles within
          # start_period+interval+timeout=15s, and bats should always get
          # to report the real status rather than hang behind a timeout.
          sleep 15

      - name: Install extra packages from the registry
        if: inputs.extra-packages != ''
        env:
          EXISTDB_SERVER: http://localhost:8080
          EXISTDB_USER: admin
          EXISTDB_PASS: ""
        run: |
          echo "${{ inputs.extra-packages }}" | while read -r pkg; do
            [ -z "$pkg" ] && continue
            echo "Installing $pkg from registry..."
            npx --yes @existdb/xst@^4 package install from-registry "$pkg" --registry "${{ inputs.registry-url }}"
          done

      - name: Download extra pre-built xars artifact
        if: inputs.extra-xars-artifact != ''
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.extra-xars-artifact }}
          path: extra-xars

      - name: Install extra pre-built xars
        if: inputs.extra-xars-artifact != ''
        env:
          EXISTDB_SERVER: http://localhost:8080
          EXISTDB_USER: admin
          EXISTDB_PASS: ""
        run: npx --yes @existdb/xst@^4 package install local-files $(ls -1 extra-xars/*.xar | sort) --registry "${{ inputs.registry-url }}/public"

      - name: Install this repo's package
        env:
          EXISTDB_SERVER: http://localhost:8080
          EXISTDB_USER: admin
          EXISTDB_PASS: ""
        run: npx --yes @existdb/xst@^4 package install local-files build/*.xar --registry "${{ inputs.registry-url }}/public"

      - name: Checkout shared test suite
        uses: actions/checkout@v7
        with:
          repository: BetaMasaheft/.github
          ref: ${{ inputs.shared-ref }}
          path: .shared-ci

      - name: Run smoke test
        env:
          PACKAGE_URI: ${{ steps.pkg.outputs.uri }}
        run: bats --tap .shared-ci/test/install-smoke.bats

      - name: Show logs on failure
        if: failure()
        run: docker logs exist
